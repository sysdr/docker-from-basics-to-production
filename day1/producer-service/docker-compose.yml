services:
  producer-service:
    build: .
    image: producer-service:day1
    container_name: my-producer
    ports:
      - "8080:8080"
    environment:
      PRODUCER_PORT: "8080"
      PRODUCER_HOSTNAME: "producer-service"
      PRODUCER_RATE: "5"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    mem_limit: 128m
    cpus: 0.50
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
